version: "3.9"

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/static-pages || true;
      exit 0;
      "

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      - minio
      - create-bucket
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Data Source=/data/mingo-static.db"
      # Override storage via API/settings UI, or seed by configuring after first login.
    ports:
      - "5218:8080"
    volumes:
      - app-data:/data

volumes:
  minio-data:
  app-data:
